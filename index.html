<style>
:root {
  --navy: #101727; --green: #12A248; --light: #7ED957; --dgreen: #0E7F38;
  --ink: #232B38; --muted: #5E687A; --faint: #8A93A3; --line: #E3E8EE;
  --soft: #F4F6F9; --mint: #EEF7E9; --amber: #C77A00; --red: #C0392B; --bg: #F7F9FB;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
code, pre, .mono, textarea.out, input.cell, input.fill { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
code { color: var(--dgreen); font-size: .92em; }
button { font: inherit; cursor: pointer; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }

/* header */
.hero { background: var(--navy); color: #fff; }
.hero .wrap { padding-top: 22px; padding-bottom: 22px; display: flex; align-items: center; gap: 18px; }
.hero img { height: 46px; width: auto; flex: none; }
.hero .t { min-width: 0; }
.eyebrow { font: 600 11px/1.2 Outfit, sans-serif; letter-spacing: 2.2px; text-transform: uppercase; color: var(--light); }
.hero h1 { font: 800 clamp(22px, 5vw, 30px)/1.1 Outfit, sans-serif; margin: 6px 0 0; }
.hero h1 span { color: var(--light); }

/* sticky bar */
.bar { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); display: none; }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-top: 10px; padding-bottom: 10px; }
.timer { font: 700 20px/1 Outfit, sans-serif; color: var(--navy); min-width: 74px; }
.timer.low { color: var(--amber); }
.prog { flex: 1; min-width: 0; }
.prog .lbl { font-size: 12px; color: var(--muted); }
.prog .track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.prog .fill { height: 100%; width: 0; background: var(--green); border-radius: 3px; transition: width .2s; }
.btn { border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; background: var(--green); color: #fff; }
.btn:hover { background: var(--dgreen); }
.btn.ghost { background: #fff; color: var(--navy); border: 1.5px solid #CBD2DC; }
.btn.ghost:hover { border-color: var(--navy); }
.btn.big { padding: 14px 28px; font-size: 17px; }

/* cards */
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 16px 0; }
.intro h2 { font: 700 22px/1.2 Outfit, sans-serif; color: var(--navy); margin: 0 0 8px; }
.intro ul { padding-left: 20px; margin: 10px 0 0; }
.intro li { margin-bottom: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 4px; }
.fact { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.fact b { display: block; font: 700 18px/1.2 Outfit, sans-serif; color: var(--navy); }
.fact span { font-size: 13px; color: var(--muted); }
.parts { margin-top: 14px; border-top: 1px solid var(--line); }
.parts div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.parts div span:last-child { color: var(--muted); white-space: nowrap; }
.tag { display: inline-block; font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .5px; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; background: var(--mint); color: var(--dgreen); vertical-align: middle; }
.tag.task { background: #EEF1F6; color: var(--navy); }

.sec { margin-top: 30px; }
.sec h2 { font: 700 21px/1.2 Outfit, sans-serif; color: var(--navy); margin: 0; }
.sec .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.sec .rule { width: 44px; height: 3px; background: var(--green); border-radius: 2px; margin-top: 8px; }

.q { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; margin: 14px 0; }
.q.done { border-color: #CFE7C2; }
.qh { display: flex; gap: 10px; align-items: baseline; }
.qn { font: 700 16px/1 Outfit, sans-serif; color: var(--green); flex: none; min-width: 26px; }
.qp { flex: 1; min-width: 0; }
.mk { flex: none; font: 500 11px/1 "JetBrains Mono", monospace; color: var(--faint); white-space: nowrap; }
.body { margin-left: 36px; margin-top: 10px; }
pre { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; font-size: 14px; line-height: 1.55; overflow-x: auto; color: #1C2433; white-space: pre; }
pre .ln { color: #A3ABB8; user-select: none; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { text-align: left; background: #fff; border: 1.5px solid #D3D9E1; border-radius: 10px; padding: 10px 12px; color: var(--ink); display: flex; gap: 10px; align-items: flex-start; }
.opt:hover { border-color: var(--green); }
.opt .l { font: 600 13px/1.6 Outfit, sans-serif; color: var(--faint); flex: none; }
.opt.sel { border-color: var(--green); background: var(--mint); }
.opt.sel .l { color: var(--dgreen); }
.tf { display: flex; gap: 8px; }
.tf .opt { flex: 1; justify-content: center; font-weight: 600; max-width: 160px; }

input.fill { font-size: 15px; padding: 9px 12px; border: 1.5px solid #D3D9E1; border-radius: 10px; width: 100%; max-width: 280px; color: var(--dgreen); background: #fff; }
input.fill:focus, textarea.out:focus, input.cell:focus, select.cell:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(18,162,72,.15); }
textarea.out { width: 100%; min-height: 96px; font-size: 15px; padding: 10px 12px; border: 1.5px solid #D3D9E1; border-radius: 10px; resize: vertical; color: var(--dgreen); background: #fff; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 6px; }

.tracewrap { overflow-x: auto; margin-bottom: 12px; }
table.trace { border-collapse: collapse; font-size: 14px; }
table.trace th { font: 500 12px/1.2 "JetBrains Mono", monospace; color: var(--muted); background: var(--soft); border: 1px solid #D3D9E1; padding: 8px 10px; text-align: center; white-space: nowrap; }
table.trace td { border: 1px solid #D3D9E1; padding: 4px; text-align: center; }
table.trace td.fixed { font-family: "JetBrains Mono", monospace; color: var(--navy); padding: 4px 12px; background: #FBFCFD; }
input.cell, select.cell { width: 84px; font-size: 15px; padding: 6px 6px; border: 1.5px solid transparent; border-radius: 6px; text-align: center; color: var(--dgreen); background: #fff; }
select.cell { width: 96px; font-family: "DM Sans", sans-serif; border-color: #E3E8EE; }
input.cell { border-color: #E3E8EE; }

.task .desc { margin: 0 0 8px; }
.task .ex { font-size: 14px; color: var(--muted); }
.task .colab { margin-top: 12px; font-size: 14px; background: #F2F5F8; border-radius: 10px; padding: 10px 12px; color: var(--navy); }
.bonus { border: 2px solid var(--green); }

.foot { text-align: center; color: var(--faint); font-size: 13px; padding: 28px 0 40px; }
.foot b { font: 600 13px Outfit, sans-serif; color: var(--navy); }
.submitrow { text-align: center; margin: 26px 0 8px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(16,23,39,.55); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal.on { display: flex; }
.modal .box { background: #fff; border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; }
.modal h3 { font: 700 20px/1.2 Outfit, sans-serif; color: var(--navy); margin: 0 0 8px; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

/* results */
.score { text-align: center; }
.score .scorenum { font: 800 52px/1 Outfit, sans-serif; color: var(--navy); margin: 6px 0; }
.score .scorenum small { font-size: 26px; color: var(--faint); }
.score .note { color: var(--muted); font-size: 15px; }
.breakdown { margin-top: 18px; text-align: left; }
.brow { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; margin: 10px 0; font-size: 15px; }
.brow .t { font-weight: 500; }
.brow .v { text-align: right; font: 600 15px Outfit, sans-serif; color: var(--navy); }
.brow .track { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.brow .track div { height: 100%; background: var(--green); border-radius: 4px; }
.brow.task .v { color: var(--muted); font: 500 13px "DM Sans", sans-serif; }
.copyrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.copied { font-size: 13px; color: var(--dgreen); min-height: 18px; margin-top: 8px; }
.rev { border-left: 4px solid var(--line); }
.rev.ok { border-left-color: var(--green); }
.rev.part { border-left-color: var(--amber); }
.rev.no { border-left-color: var(--red); }
.verdict { font: 600 12px/1 "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .5px; }
.ok .verdict { color: var(--green); } .part .verdict { color: var(--amber); } .no .verdict { color: var(--red); }
.ansrow { font-size: 14px; margin-top: 6px; }
.ansrow .k { color: var(--muted); display: inline-block; min-width: 96px; }
.ansrow .v { font-family: "JetBrains Mono", monospace; font-variant-ligatures: none; color: var(--navy); word-break: break-word; }
.why { margin-top: 8px; font-size: 14px; background: var(--soft); border-radius: 8px; padding: 8px 10px; color: var(--ink); }

@media (max-width: 560px) {
  .opts { grid-template-columns: 1fr; }
  .body { margin-left: 0; }
  .hero img { height: 38px; }
  .q { padding: 16px 14px 14px; }
  .card { padding: 16px; }
  .timer { font-size: 18px; min-width: 64px; }
  .btn { padding: 9px 14px; }
  input.cell { width: 60px; }
  select.cell { width: 78px; }
  table.trace th { padding: 6px 6px; white-space: normal; }
  .prog .more { display: none; }
}
</style>
</head>

(function () {
  "use strict";
  const KEY = "rm-quiz-" + CFG.id;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // stored answers are scrambled so they aren't readable in the page source
  function unscramble(b64) {
    const bin = atob(b64); const k = CFG.k; let out = "";
    for (let i = 0; i < bin.length; i++) out += String.fromCharCode(bin.charCodeAt(i) ^ k.charCodeAt(i % k.length));
    return JSON.parse(decodeURIComponent(escape(out)));
  }

  // ---- storage (works without it, just won't survive a refresh) ----
  let S = { started: null, answers: {}, submitted: null, result: null };
  function load() { try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {} }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  if (/[?&]reset\b/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, "", location.pathname); }
  load();

  $("#eyebrow").textContent = CFG.eyebrow;
  $("#h1").innerHTML = esc(CFG.title) + "<br><span>" + esc(CFG.subtitle) + "</span>";
  document.title = CFG.title + " · Rhobust Minds";

  function codeBlock(src, numbered) {
    const lines = src.replace(/^\n+|\n+$/g, "").split("\n");
    return "<pre>" + lines.map((l, i) => (numbered ? '<span class="ln">' + (i + 1) + "  </span>" : "") + esc(l)).join("\n") + "</pre>";
  }

  // ---------------- quiz view ----------------
  function renderIntro() {
    const parts = CFG.sections.map(s => `<div><span>${esc(s.name)}</span><span>${esc(s.info)}</span></div>`).join("");
    $("#main").innerHTML = `
      <section class="card intro">
        <h2>Hi ${esc(CFG.student)}!</h2>

        <div class="facts">
          <div class="fact"><b>${CFG.minutes} minutes</b><span>timer starts when you press Start</span></div>
          <div class="fact"><b>${CFG.questions.filter(q => !q.bonus).length} questions</b><span>${AUTO.length} checked here, ${TASKS.filter(q => !q.bonus).length} coding tasks in Colab</span></div>
          <div class="fact"><b>${CFG.totalMarks} marks</b><span>${esc(CFG.split)}</span></div>
        </div>
        <ul>
          <li>Your answers save as you go, so a refresh won't lose them. The timer keeps running too.</li>
          <li>Coding tasks are done in Google Colab. I will check those myself.</li>
          <li>When time runs out, the quiz submits on its own.</li>
          <li>After you submit, press <b>Copy my results</b> and send them to me.</li>
        </ul>
        <div class="parts">${parts}</div>
        <div class="submitrow"><button class="btn big" id="startBtn">Start the quiz</button></div>
      </section>`;
    $("#startBtn").onclick = () => { S.started = Date.now(); save(); renderQuiz(); };
  }

  function renderQuestion(q) {
    const a = S.answers[q.id];
    const head = `<div class="qh"><span class="qn">${q.bonus ? "★" : q.n + "."}</span><div class="qp">${q.prompt}</div><span class="mk">${q.bonus ? "+" + q.marks + " bonus" : q.marks + (q.marks === 1 ? " mark" : " marks")}</span></div>`;
    let body = "";
    if (q.code) body += codeBlock(q.code, q.numbered);
    if (q.type === "mcq") {
      body += '<div class="opts">' + q.opts.map((o, i) => `<button class="opt${a === i ? " sel" : ""}" data-q="${q.id}" data-v="${i}"><span class="l">${"abcd"[i]})</span><span>${o}</span></button>`).join("") + "</div>";
    } else if (q.type === "tf") {
      body += '<div class="tf">' + ["True", "False"].map((o, i) => `<button class="opt${a === (i === 0) ? " sel" : ""}" data-q="${q.id}" data-v="${i === 0}">${o}</button>`).join("") + "</div>";
    } else if (q.type === "fill") {
      body += `<input class="fill" data-q="${q.id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" value="${esc(a || "")}">`;
    } else if (q.type === "out") {
      body += `<p class="hint">Type exactly what it prints, one line per printed value.</p><textarea class="out" data-q="${q.id}" spellcheck="false" autocapitalize="off" placeholder="Output">${esc(a || "")}</textarea>`;
    } else if (q.type === "trace") {
      const t = a || {};
      const head2 = "<tr>" + q.cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>";
      const rows = q.rows.map((r, ri) => "<tr>" + r.map((cell, ci) => {
        if (cell !== null && typeof cell === "object" && "fixed" in cell) return `<td class="fixed">${esc(cell.fixed)}</td>`;
        const key = ri + "_" + ci; const v = (t.cells || {})[key] || "";
        if (q.selects && q.selects[ci]) return `<td><select class="cell" data-q="${q.id}" data-cell="${key}"><option value=""></option>${q.selects[ci].map(o => `<option${v === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></td>`;
        return `<td><input class="cell" data-q="${q.id}" data-cell="${key}" inputmode="numeric" autocomplete="off" value="${esc(v)}"></td>`;
      }).join("") + "</tr>").join("");
      body += `<p class="hint">${q.traceHint}</p><div class="tracewrap"><table class="trace">${head2}${rows}</table></div>
        <p class="hint">Now type the output, one value per line.</p><textarea class="out" data-q="${q.id}" data-part="out" spellcheck="false" placeholder="Output">${esc(t.out || "")}</textarea>`;
    } else if (q.type === "task") {
      body = `<span class="tag task">Colab task</span><div style="margin-top:10px"></div><div class="desc">${q.desc || ""}</div>` + (q.code ? codeBlock(q.code, q.numbered) : "") +
        `${q.ex ? `<div class="ex">${q.ex}</div>` : ""}
         <div class="colab">${q.bonus ? "Optional. Write this in Colab if you have time left. I will check it." : "Write this in Colab. I will check it."}</div>`;
    }
    return `<div class="q${q.type === "task" ? " task" : ""}${q.bonus ? " bonus" : ""}${answered(q) ? " done" : ""}" id="${q.id}">${head}<div class="body">${body}</div></div>`;
  }

  function answered(q) {
    const a = S.answers[q.id];
    if (q.type === "task") return false;
    if (q.type === "trace") return !!(a && a.out && a.out.trim());
    if (q.type === "mcq" || q.type === "tf") return a !== undefined && a !== null;
    return typeof a === "string" && a.trim() !== "";
  }

  function renderQuiz() {
    $("#bar").style.display = "block";
    let html = "";
    CFG.sections.forEach(sec => {
      html += `<section class="sec"><h2>${esc(sec.name)}</h2><div class="sub">${esc(sec.sub)}</div><div class="rule"></div></section>`;
      CFG.questions.filter(q => q.sec === sec.id).forEach(q => { html += renderQuestion(q); });
    });
    html += `<div class="submitrow"><button class="btn big" id="submitBottom">Submit my quiz</button></div>`;
    $("#main").innerHTML = html;
    window.scrollTo(0, 0);
    bind();
    progress();
    tick();
  }

  function bind() {
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const q = b.dataset.q; const raw = b.dataset.v;
      S.answers[q] = raw === "true" ? true : raw === "false" ? false : Number(raw);
      b.parentElement.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); save(); mark(q); progress();
    });
    document.querySelectorAll("input.fill, textarea.out").forEach(el => el.oninput = () => {
      const q = el.dataset.q;
      if (el.dataset.part === "out") { S.answers[q] = Object.assign({ cells: {} }, S.answers[q] || {}); S.answers[q].out = el.value; }
      else S.answers[q] = el.value;
      save(); mark(q); progress();
    });
    document.querySelectorAll("input.cell, select.cell").forEach(el => {
      const h = () => { const q = el.dataset.q; S.answers[q] = Object.assign({ cells: {}, out: "" }, S.answers[q] || {}); S.answers[q].cells[el.dataset.cell] = el.value; save(); };
      el.oninput = h; el.onchange = h;
    });
    $("#submitBottom").onclick = askSubmit;
    $("#submitTop").onclick = askSubmit;
  }
  function mark(id) { const q = AUTO.find(x => x.id === id); const el = document.getElementById(id); if (q && el) el.classList.toggle("done", answered(q)); }
  function progress() {
    const n = AUTO.filter(answered).length;
    $("#proglbl").innerHTML = n + " of " + AUTO.length + " answered<span class=\"more\"> · plus " + TASKS.filter(q => !q.bonus).length + " coding tasks in Colab</span>";
    $("#progfill").style.width = (100 * n / AUTO.length) + "%";
  }

  let timerId = null;
  function remaining() { return CFG.minutes * 60000 - (Date.now() - S.started); }
  function tick() {
    clearTimeout(timerId);
    if (S.submitted) return;
    const r = remaining();
    if (r <= 0) { submit(true); return; }
    const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
    const el = $("#timer"); el.textContent = m + ":" + String(s).padStart(2, "0");
    el.classList.toggle("low", r < 5 * 60000);
    timerId = setTimeout(tick, 500);
  }

  function askSubmit() {
    const n = AUTO.filter(answered).length;
    $("#modalText").innerHTML = `<p style="margin:0">You've answered <b>${n} of ${AUTO.length}</b> questions on this page.${n < AUTO.length ? " Any blank ones will count as zero." : ""}</p><p style="margin:10px 0 0">Make sure your Colab programs are saved too.</p>`;
    $("#modal").classList.add("on");
  }
  $("#mCancel").onclick = () => $("#modal").classList.remove("on");
  $("#mOk").onclick = () => { $("#modal").classList.remove("on"); submit(false); };

  // ---------------- grading ----------------
  const tokens = s => String(s || "").split(/[\s,]+/).map(t => t.replace(/^["']+|["']+$/g, "")).filter(Boolean);
  const normFill = (s, cs) => { let t = String(s || "").trim().replace(/^["']+|["']+$/g, "").replace(/\s+/g, " ").trim(); return cs ? t : t.toLowerCase(); };
  function lev(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function scoreOut(rule, got, exp, marks) {
    if (rule === "all") return got.join(" ") === exp.join(" ") ? marks : 0;
    if (rule === "near") { const d = lev(got, exp); return d === 0 ? marks : d === 1 ? marks - 1 : 0; }
    if (rule === "perline") return exp.reduce((s, e, i) => s + (got[i] === e ? 1 : 0), 0);
    if (rule === "firstplus") { let s = got[0] === exp[0] ? 1 : 0; if (got.slice(1).join(" ") === exp.slice(1).join(" ")) s += marks - 1; return s; }
    return 0;
  }
  function grade() {
    const per = {}; let total = 0; const bySec = {};
    AUTO.forEach(q => {
      const sol = unscramble(q.s); const a = S.answers[q.id]; let got = 0, yours = "", right = "";
      if (q.type === "mcq") { got = a === sol.a ? q.marks : 0; yours = a == null ? "" : "abcd"[a] + ") " + strip(q.opts[a]); right = "abcd"[sol.a] + ") " + strip(q.opts[sol.a]); }
      else if (q.type === "tf") { got = a === sol.a ? q.marks : 0; yours = a == null ? "" : (a ? "True" : "False"); right = sol.a ? "True" : "False"; }
      else if (q.type === "fill") { got = sol.a.some(x => normFill(x, q.cs) === normFill(a, q.cs)) ? q.marks : 0; yours = (a || "").trim(); right = sol.a[0]; }
      else if (q.type === "out") { const t = tokens(a); got = scoreOut(q.rule, t, sol.a, q.marks); yours = t.join(" · "); right = sol.a.join(" · "); }
      else if (q.type === "trace") {
        const t = a || { cells: {}, out: "" }; let ok = 0, n = 0;
        Object.keys(sol.cells).forEach(k => { n++; if (normFill((t.cells || {})[k], false) === normFill(sol.cells[k], false)) ok++; });
        const tableMarks = ok === n ? 2 : ok * 2 >= n ? 1 : 0;
        const outMarks = tokens(t.out).join(" ") === sol.out.join(" ") ? 1 : 0;
        got = tableMarks + outMarks;
        yours = "table " + ok + "/" + n + " cells right · output " + (tokens(t.out).join(" · ") || "(blank)");
        right = "output " + sol.out.join(" · ");
      }
      per[q.id] = { got, max: q.marks, yours, right, why: sol.why };
      total += got;
      bySec[q.sec] = bySec[q.sec] || { got: 0, max: 0 }; bySec[q.sec].got += got; bySec[q.sec].max += q.marks;
    });
    return { total, max: autoMax, per, bySec };
  }
  const strip = h => String(h == null ? "" : h).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"');

  function submit(auto) {
    if (S.submitted) return;
    S.submitted = Date.now(); S.autoSubmitted = !!auto;
    S.result = grade(); save();
    renderResults();
  }

  // ---------------- results ----------------
  function fmtDur(ms) { const t = Math.max(0, Math.round(ms / 1000)); return Math.floor(t / 60) + " min " + (t % 60) + " s"; }
  function renderResults() {
    clearTimeout(timerId);
    $("#bar").style.display = "none";
    const R = S.result || grade();
    const used = Math.min(S.submitted - S.started, CFG.minutes * 60000);
    const secRows = CFG.sections.map(sec => {
      if (sec.kind === "task") return `<div class="brow task"><span class="t">${esc(sec.name)}</span><span class="v">I will check</span></div>`;
      const b = R.bySec[sec.id] || { got: 0, max: 0 };
      return `<div class="brow"><span class="t">${esc(sec.name)}</span><span class="v">${b.got}/${b.max}</span><div class="track"><div style="width:${b.max ? 100 * b.got / b.max : 0}%"></div></div></div>`;
    }).join("");
    let rev = "";
    CFG.sections.forEach(sec => {
      rev += `<section class="sec"><h2>${esc(sec.name)}</h2><div class="rule"></div></section>`;
      CFG.questions.filter(q => q.sec === sec.id).forEach(q => {
        if (q.type === "task") {
          rev += `<div class="q rev task${q.bonus ? " bonus" : ""}"><div class="qh"><span class="qn">${q.bonus ? "★" : q.n + "."}</span><div class="qp">${q.prompt}</div><span class="mk">${q.bonus ? "+" + q.marks + " bonus" : q.marks + " marks"}</span></div><div class="body"><span class="tag task">I will check this in Colab</span></div></div>`;
          return;
        }
        const p = R.per[q.id]; const cls = p.got === p.max ? "ok" : p.got > 0 ? "part" : "no";
        const vt = p.got === p.max ? "Correct" : p.got > 0 ? "Partly right" : (p.yours ? "Not quite" : "Not answered");
        rev += `<div class="q rev ${cls}"><div class="qh"><span class="qn">${q.n}.</span><div class="qp">${q.prompt}</div><span class="mk">${p.got}/${p.max}</span></div>
          <div class="body">${q.code ? codeBlock(q.code, q.numbered) : ""}<span class="verdict">${vt}</span>
          <div class="ansrow"><span class="k">Your answer</span><span class="v">${esc(p.yours || "(blank)")}</span></div>
          ${p.got === p.max ? "" : `<div class="ansrow"><span class="k">Right answer</span><span class="v">${esc(p.right)}</span></div>`}
          <div class="why">${esc(p.why)}</div></div></div>`;
      });
    });
    $("#main").innerHTML = `
      <section class="card score">
        <div class="eyebrow" style="color:var(--green)">${S.autoSubmitted ? "Time's up, quiz submitted" : "Quiz submitted"}</div>
        <div class="scorenum">${R.total}<small> / ${R.max}</small></div>
        <div class="note">marks on the questions checked here. Your ${TASKS.filter(q => !q.bonus).length} coding tasks (${taskMax} marks) are done in Colab, and I will check them.</div>
        <div class="note" style="margin-top:4px">Time used: ${fmtDur(used)} of ${CFG.minutes} min</div>
        <div class="breakdown">${secRows}</div>
        <div class="copyrow"><button class="btn big" id="copyBtn">Copy my results</button></div>
        <div class="copied" id="copied"></div>
      </section>
      ${rev}`;
    $("#copyBtn").onclick = copyResults;
    window.scrollTo(0, 0);
  }

  function resultsText() {
    const R = S.result; const used = Math.min(S.submitted - S.started, CFG.minutes * 60000);
    const lines = [];
    lines.push("Rhobust Minds · " + CFG.title);
    lines.push("Submitted: " + new Date(S.submitted).toLocaleString() + (S.autoSubmitted ? " (time ran out)" : ""));
    lines.push("Time used: " + fmtDur(used) + " of " + CFG.minutes + " min");
    lines.push("Checked here: " + R.total + "/" + R.max);
    CFG.sections.filter(s => s.kind !== "task").forEach(s => { const b = R.bySec[s.id] || { got: 0, max: 0 }; lines.push("  " + s.name + ": " + b.got + "/" + b.max); });
    lines.push("Coding tasks (" + taskMax + " marks): done in Colab, to be checked");
    const missed = AUTO.filter(q => R.per[q.id].got < R.per[q.id].max);
    lines.push("");
    lines.push(missed.length ? "Questions to go over:" : "All questions on this page were correct.");
    missed.forEach(q => { const p = R.per[q.id]; lines.push("Q" + q.n + " (" + p.got + "/" + p.max + "): answered " + (p.yours || "(blank)") + " | right answer " + p.right); });
    return lines.join("\n");
  }
  function copyResults() {
    const txt = resultsText(); const done = () => { $("#copied").textContent = "Copied. Paste it in your message to me."; };
    const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { $("#copied").textContent = "Couldn't copy. Select the text below and copy it."; } ta.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  }

  // ---------------- start ----------------
  if (S.submitted) renderResults();
  else if (S.started) { if (remaining() <= 0) submit(true); else renderQuiz(); }
  else renderIntro();
})();
</script>
</body>
